<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IBG Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
/* Layout: preview frame = slim switch bar, then the module exactly as Squarespace would hold it. */
:root{--bg:#ffffff;--ink:#282828;--muted:#6e6c68;--line:rgba(40,40,40,.10);--accent:#F26721;color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px}
.frame{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:101;background:#fff}
.switch-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:4px;padding:3px;border-radius:999px;background:#f2f1ee}
.tabs a{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.tabs a[aria-current="page"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.view{padding-block:36px 64px}
.note{max-width:1240px;margin:40px auto 0;padding:18px 20px;border:1px dashed rgba(40,40,40,.22);border-radius:14px;color:var(--muted);font-size:14px}
.note b{color:var(--ink)}
@media (max-width:560px){.brand{display:none}.view{padding-block:22px 90px}}
</style>
</head>
<body>
<div class="switch frame"><div class="switch-in">
  <div class="brand">Iceland <span>by</span> Guide</div>
  <nav class="tabs" aria-label="Preview">
    <a href="#shop" id="tab-shop">Shop hero</a>
    <a href="#explore" id="tab-explore">Explore page</a>
  </nav>
</div></div>
<main class="frame">
  <section class="view" id="view-shop" hidden>
    <div class="ibg-explore" data-mode="hero" data-explore-url="#explore" data-src="places.json" data-assets=""></div>
    <p class="note"><b>Your existing guide shop continues here.</b> On icelandbyguide.com/itineraries this map sits above the product grid you already have. Each place links straight to the guides that include it.</p>
  </section>
  <section class="view" id="view-explore" hidden>
    <div class="ibg-explore-x" data-mode="explore" data-src="places.json" data-assets=""></div>
  </section>
</main>
<script src="ibg-explore.js"></script>
<script>
(function(){
  function show(){
    var v=(location.hash||'#shop').slice(1); if(v!=='explore') v='shop';
    document.getElementById('view-shop').hidden=v!=='shop';
    document.getElementById('view-explore').hidden=v!=='explore';
    document.getElementById('tab-shop').setAttribute('aria-current',v==='shop'?'page':'false');
    document.getElementById('tab-explore').setAttribute('aria-current',v==='explore'?'page':'false');
    var el=document.querySelector(v==='shop'?'.ibg-explore':'.ibg-explore-x');
    if(!el.__ibgx) window.IBGExplore.mount(el); else if(el.__ibgx.map) el.__ibgx.map.resize();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',show); show();
})();
</script>

</body>
</html>
